name: Version check

# Enforces the plugin version scheme (YYYY.X-Y.N) on pull requests.
# On the integration branch `develop` the version must stay equal to the base: releases are
# minted only by the develop -> main promotion PR, which carries the single bump.
# Any change under skills/, commands/, agents/, templates/, mcp-servers/, output-styles/,
# .mcp.json or plugin.json must bump .claude-plugin/plugin.json "version", or nothing
# reaches installed copies: Claude Code caches plugins by that string.
# See CONTRIBUTING.md "Release branches, tags and backports" and scripts/check-version.sh.

on:
  pull_request:
    branches: ["main", "develop", "release-*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Fetch base and tags
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          git fetch origin "+refs/tags/*:refs/tags/*"
      - name: Check plugin.json version against base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: scripts/check-version.sh "origin/$BASE_REF"
      - name: Validate plugin manifest
        run: |
          jq -e '.name and .version and .description' .claude-plugin/plugin.json >/dev/null
          echo "plugin.json parses; version $(jq -r .version .claude-plugin/plugin.json)"
