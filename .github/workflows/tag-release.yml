name: Tag release

# On every push to main or a release-X.Y branch, create the tag
#   release-<plugin.json version>        e.g. release-2026.603.3
# if it does not exist yet, then publish a GitHub Release from it. The tag is derived from
# the manifest, so tag and manifest always agree. Branch names stay release-X.Y because the
# Domino DSE update script resolves them by exact name; tags are the per-release labels an
# admin can pin to, and the GitHub Release is what a marketplace tracking releases picks up.

on:
  push:
    branches: ["main", "release-*"]
    paths:
      - ".claude-plugin/plugin.json"
      - "skills/**"
      - "commands/**"
      - "agents/**"
      - "templates/**"
      - "mcp-servers/**"
      - "output-styles/**"
      - "hooks/**"
      - "bin/**"
      - "workflows/**"
      - "themes/**"
      - "monitors/**"
      - ".mcp.json"
      - ".lsp.json"
      - "settings.json"

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Read version
        id: v
        run: |
          v="$(jq -r '.version // empty' .claude-plugin/plugin.json)"
          [ -n "$v" ] || { echo "::error::plugin.json has no version"; exit 1; }
          [[ "$v" =~ ^[0-9]{4}\.([1-9][0-9]{2,})\.[0-9]+$ ]] || { echo "::error::version '$v' is not YYYY.DDD.N (e.g. 2026.603.3)"; exit 1; }
          code="${BASH_REMATCH[1]}"
          line="$(( code / 100 )).$(( code % 100 ))"
          if [[ "$GITHUB_REF_NAME" =~ ^release-([0-9]+)\.([0-9]+)$ ]] && [ "$(( BASH_REMATCH[1] * 100 + BASH_REMATCH[2] ))" -ne "$code" ]; then
            echo "::error::branch $GITHUB_REF_NAME carries version $v (Domino line $line); its line code must be $(( BASH_REMATCH[1] * 100 + BASH_REMATCH[2] ))"; exit 1
          fi
          echo "line=$line" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=release-$v" >> "$GITHUB_OUTPUT"
      - name: Create tag if absent
        env:
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          git fetch origin "+refs/tags/*:refs/tags/*"
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            existing="$(git rev-list -n1 "$TAG")"
            if [ "$existing" = "$GITHUB_SHA" ]; then
              echo "$TAG already points at $GITHUB_SHA; nothing to do"; exit 0
            fi
            echo "::error::$TAG already exists at $existing but this push is $GITHUB_SHA. Two changes landed with the same version. Recover with a bump-only PR to the next N; do not move or delete the existing tag. See CONTRIBUTING.md 'Release branches, tags and backports'."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "domino-claude-plugin $VERSION (${GITHUB_REF_NAME})" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "created $TAG at $GITHUB_SHA"
      - name: Publish GitHub Release
        # A published (non-draft, non-prerelease) Release is what the Anthropic marketplace's
        # releases-only tracking resolves; without one the entry HEAD-tracks main instead.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
          LINE: ${{ steps.v.outputs.line }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; nothing to do"; exit 0
          fi
          gh release create "$TAG" --verify-tag --title "$VERSION" \
            --notes "domino-claude-plugin $VERSION for Domino $LINE and later, including Domino Cloud. Install or update with \`claude plugin update dominodatalab@claude-plugins-official\`. Commit ${GITHUB_SHA}."
          echo "published release $TAG"
